:root{ /* Reaktor-Thema, fuer Reizarmut leicht entsaettigt */
  --bg:#060b0e; --bg-innen:#0a1317; --rand:#1d3a40;
  --kern-hell:#12262d; --kern-dunkel:#03070a;
  --akzent:#2ee6d6; --akzent-weich:#7ff5ea; --akzent-text:#03201d;
  --text:#dff7f4; --text-dim:#86a9ad;
  --ok:#00ff9d; --wahl:#ffb000;
  --ok-60:#029d64; --wahl-60:#9b6e06;            /* 60-%-Mischungen mit --bg */
  --glow:rgba(46,230,214,.15);
  --glas:rgba(10,19,23,.62);
  --flaeche:#0d1a1f; --flaeche2:#132a31;
  --spur1:#2ee6d6; --spur2:#8a7cff; --spur3:#e8b04a; --spur4:#e07ac8;
  --fh:"Bahnschrift","Barlow Semi Condensed",system-ui,"Segoe UI",Roboto,sans-serif;
  --fm:"Consolas",ui-monospace,"Roboto Mono",monospace;
  --tipp:80px;          /* Mindestgroesse fuer Tippflaechen */
  --bar-h:100px;
}
:root[data-theme="sanft"]{ /* das alte, weichere Design aus Version 1 */
  --bg:#26334a; --bg-innen:#2e3d57; --rand:#4d6187;
  --kern-hell:#4a5f86; --kern-dunkel:#26334a;
  --akzent:#f1e2a9; --akzent-weich:#fff1c4; --akzent-text:#2a3346;
  --text:#eef2f7; --text-dim:#bac6d6;
  --glow:rgba(241,226,169,.16); --glas:rgba(56,73,106,.88);
  --flaeche:#38496a; --flaeche2:#425578;
  --spur1:#8fb8de; --spur2:#a8d5ba; --spur3:#efc9a5; --spur4:#c9b6e4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--fh);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:none;background:none;padding:0}
svg{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  background:radial-gradient(ellipse at 50% 0%, var(--bg-innen), var(--bg) 70%)}
.screen.active{display:flex}
.hud{font-family:var(--fm);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--text-dim)}
.eck{color:var(--akzent)}

/* ---------- gemeinsame Bausteine ---------- */
.glas{background:linear-gradient(160deg, rgba(46,230,214,.05), rgba(0,0,0,0) 45%), var(--glas);
  box-shadow:inset 0 0 0 1px var(--rand);
  --ecke:14px;
  clip-path:polygon(var(--ecke) 0,100% 0,100% calc(100% - var(--ecke)),calc(100% - var(--ecke)) 100%,0 100%,0 var(--ecke))}
.pille{position:relative;min-height:var(--tipp);min-width:var(--tipp);padding:0 22px 0 30px;border-radius:999px;
  background:var(--flaeche);box-shadow:inset 0 0 0 1px var(--rand);font-size:21px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;flex:0 0 auto;
  transition:background-color .6s ease-in-out, box-shadow .6s ease-in-out, transform .6s ease-in-out}
.pille::before{content:"";position:absolute;left:14px;top:50%;width:6px;height:36%;transform:translateY(-50%);
  border-radius:3px;background:var(--mark,var(--rand));transition:background-color .6s ease-in-out}
.pille.sel,.pille.on{background:var(--flaeche2);box-shadow:inset 0 0 0 2px var(--akzent),0 0 22px var(--glow);--mark:var(--akzent)}
.pille:active{transform:scale(.97)}
.pille .klein{display:block;font-family:var(--fm);font-size:12px;letter-spacing:.08em;color:var(--text-dim);font-weight:400}
.pille.on .klein{color:var(--akzent-weich)}
.pille .zwei{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}

/* ---------- Schieberegler (gross fuer Finger) ---------- */
.slider-row{display:flex;align-items:center;gap:10px;min-width:0}
.slider-row .sym{flex:0 0 auto;width:28px;height:28px;color:var(--text-dim)}
.val{min-width:58px;font-family:var(--fm);font-size:16px;text-align:right;color:var(--text-dim);flex:0 0 auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:var(--tipp);background:transparent;margin:0;touch-action:none}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--rand)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle, var(--akzent) 0 30%, var(--kern-hell) 34%);margin-top:-18px;
  box-shadow:0 0 0 3px var(--akzent),0 0 18px var(--glow)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--rand)}
input[type=range]::-moz-range-thumb{width:42px;height:42px;border-radius:50%;background:var(--kern-hell);border:3px solid var(--akzent)}

/* ---------- Menue ---------- */
#menu{padding:14px 24px 10px;gap:12px}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto}
.kopf h1{margin:0;font-size:34px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.kopf-r{display:flex;align-items:center;gap:16px}
.menu-main{flex:1 1 auto;min-height:0;display:flex;gap:22px;align-items:stretch}
.scheibe-btn{position:relative;height:100%;aspect-ratio:1/1;max-width:44vw;flex:0 0 auto;border-radius:50%;align-self:center}
.scheibe-btn svg.ringe{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scheibe{position:absolute;inset:15%;border-radius:50%;
  background:radial-gradient(circle at 50% 38%, var(--kern-hell), var(--kern-dunkel) 72%);
  box-shadow:inset 0 0 0 1px var(--rand),0 0 40px var(--glow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  transition:transform .8s ease-in-out}
.scheibe-btn:active .scheibe{transform:scale(.97)}
.scheibe .s-ico{width:28%;height:auto;color:var(--akzent)}
.scheibe .s-name{font-size:clamp(22px,3.6vh,34px);font-weight:600}
.scheibe .s-sub{font-size:clamp(13px,1.9vh,16px)}
.deko{transform-box:fill-box;transform-origin:center}
[data-ruhe="voll"] .r-a{animation:drehen 120s linear infinite}
[data-ruhe="voll"] .r-b{animation:drehen 180s linear infinite reverse}
[data-ruhe="voll"] .r-c{animation:drehen 240s linear infinite}
[data-ruhe="voll"] .scheibe{animation:atmen 4s ease-in-out infinite}
body.still .deko,body.still .scheibe{animation-play-state:paused !important}
@keyframes drehen{to{transform:rotate(360deg)}}
@keyframes atmen{0%,100%{box-shadow:inset 0 0 0 1px var(--rand),0 0 30px var(--glow)}50%{box-shadow:inset 0 0 0 1px var(--rand),0 0 54px var(--glow)}}
@media (prefers-reduced-motion: reduce){ .deko,.scheibe{animation:none !important} }

.modes{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px}
.karte{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;
  padding:16px 18px;text-align:left;min-height:var(--tipp);transition:transform .6s ease-in-out}
.karte::before{content:"";position:absolute;left:0;top:22%;width:4px;height:30%;background:var(--mark,var(--akzent));border-radius:0 3px 3px 0}
.karte:active{transform:scale(.97)}
.karte .k-ico{width:58px;height:58px;color:var(--mark,var(--akzent));margin-bottom:auto}
.karte .name{font-size:23px;font-weight:600;line-height:1.1}
.karte .desc{font-size:16px;color:var(--text-dim);line-height:1.25}
.menu-fuss{flex:0 0 auto;display:flex;align-items:center;gap:20px}
.menu-fuss .vol-box{flex:0 1 460px;padding:0 20px;display:flex;align-items:center}
.menu-fuss .vol-box .slider-row{flex:1 1 auto}
footer{margin-left:auto;color:var(--text-dim);font-size:16px;white-space:nowrap}

/* ---------- Leiste oben in jedem Spiel ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:var(--bar-h);flex:0 0 auto;
  background:linear-gradient(180deg,var(--bg-innen),rgba(10,19,23,.6));box-shadow:inset 0 -1px 0 var(--rand)}
.back{min-width:150px;min-height:var(--tipp);border-radius:999px;background:var(--akzent);color:var(--akzent-text);
  font-size:25px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;padding:0 22px 0 16px;
  box-shadow:0 0 24px var(--glow);transition:transform .6s ease-in-out}
.back svg{width:30px;height:30px}
.back:active{transform:scale(.97)}
.bar .title{font-size:23px;font-weight:600;flex:1 1 auto;min-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.bar .title small{display:block;font-size:17px;font-weight:400;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis}
.bar .title .hud{display:block;font-size:12px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.bar .ctl{flex:0 1 210px;min-width:130px}
.bar .ctl.tempo-ctl{flex:0 1 230px;min-width:150px}
.bar .pille{padding:0 14px 0 26px;font-size:18px}
.bar .pille::before{left:11px}
.flow{width:58px;height:58px;flex:0 0 auto}
.tab{font-size:19px}
.stage{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- Liederauswahl ---------- */
.stufen{position:absolute;inset:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.stufe{flex:1 1 0;min-height:0;display:flex;gap:12px}
.stufe-kopf{flex:0 0 118px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding-left:4px}
.stufe-kopf b{font-family:var(--fm);font-size:20px;letter-spacing:.08em;color:var(--akzent);font-weight:400}
.stufe-kopf span{font-size:14px;color:var(--text-dim);line-height:1.2}
.lied-reihe{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.lied-karte{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
  padding:10px 12px 10px 16px;text-align:left;min-height:var(--tipp);--ecke:12px;transition:transform .6s ease-in-out, opacity .6s ease-in-out}
.lied-karte::before{content:"";position:absolute;left:0;top:18%;width:4px;height:34%;background:var(--mark);border-radius:0 3px 3px 0}
.lied-karte:active{transform:scale(.97)}
.lied-karte .lt{font-size:20px;font-weight:600;line-height:1.1}
.lied-karte .ls{font-family:var(--fm);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.lied-karte .lsterne{display:flex;gap:4px}
.lied-karte .lsterne svg{width:20px;height:20px}
.lied-karte.zu{opacity:.5}
.lied-karte .schloss{position:absolute;right:10px;top:10px;width:22px;height:22px;color:var(--text-dim)}

/* ---------- Kachel-Lieder Spielfeld ---------- */
#liedStage{background:var(--bg)}

/* ---------- Einstellungen ---------- */
.einst-grid{position:absolute;inset:14px 18px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:12px 16px;align-content:start}
.eblock{padding:10px 18px 8px;display:flex;flex-direction:column;gap:2px}
.eblock .hud{font-size:13px}
.eblock .ezeile{display:flex;align-items:center;gap:12px;min-height:var(--tipp);flex-wrap:nowrap}
.eblock .ezeile .slider-row{flex:1 1 auto}
.eblock .ehinweis{font-size:14px;color:var(--text-dim);line-height:1.3}

/* ---------- Warte-Modus ---------- */
.wgrid{position:absolute;inset:16px 18px 36px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:16px}
.cell{border-radius:28px;background:var(--flaeche);box-shadow:inset 0 0 0 1px var(--rand);position:relative;overflow:hidden;min-height:64px;
  transition:background-color 1s ease-in-out, filter 1s ease-in-out}
.cell.glow{background:var(--col);animation:breathe 3.2s ease-in-out infinite}
.cell.glow.hint{animation:breathe 3.2s ease-in-out infinite, hintpulse 1.4s ease-in-out 2}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 0 var(--glow);filter:brightness(.9)}
  50%{box-shadow:0 0 44px 8px var(--glow);filter:brightness(1.02)}
}
@keyframes hintpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.progress{position:absolute;left:18px;right:18px;bottom:14px;height:8px;border-radius:4px;background:var(--rand);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--akzent);border-radius:4px;transition:width .8s ease-in-out}
.ripple{position:absolute;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
  border:3px solid rgba(255,255,255,.45);transform:scale(0);animation:ripple 1.1s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1.6);opacity:0}}

/* ---------- Muster merken ---------- */
.sgrid{position:absolute;top:14px;bottom:110px;left:50%;transform:translateX(-50%);width:min(96%,1040px);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px}
.sfield{border-radius:30px;background:var(--col);filter:brightness(.5) saturate(.8);min-height:64px;position:relative;overflow:hidden;
  transition:filter .6s ease-in-out, transform .6s ease-in-out}
.sfield.on{filter:brightness(1) saturate(1);transform:scale(1.02)}
.sfield.hint{animation:hintpulse 1.4s ease-in-out 2;filter:brightness(.85) saturate(.95)}
.sbottom{position:absolute;left:0;right:0;bottom:10px;height:90px;display:flex;align-items:center;justify-content:center;gap:24px}
.status{font-size:28px;min-width:340px;text-align:center}
.slen{font-size:15px}

/* ---------- Beruhigende Spiele ---------- */
.pads{position:absolute;inset:16px;display:none;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:14px}
.pads.show{display:grid}
.pad{border-radius:26px;background:var(--col);filter:brightness(.62) saturate(.8);position:relative;overflow:hidden;min-height:64px;
  transition:filter .6s ease-in-out}
.pad:active{filter:brightness(.85) saturate(.95)}
#calmCanvas.hidden{display:none}

/* ---------- Kuthu-Trommeln ---------- */
.bar .ctl.bpm-ctl{flex:0 1 240px}
.dwrap{position:absolute;inset:12px 18px 14px;display:flex;flex-direction:column;gap:10px}
.drow{display:flex;align-items:center;gap:10px;flex:0 0 auto;flex-wrap:wrap}
.drow .pille{font-size:18px;padding:0 16px 0 26px}
.drow .pille::before{left:11px}
.demo{margin-left:auto}
.dsteps{display:flex;justify-content:center;gap:14px;flex:0 0 auto;min-height:32px;align-items:center}
.dstep{width:26px;height:26px;border-radius:50%;background:var(--flaeche);box-shadow:inset 0 0 0 2px var(--rand);transition:background-color .6s ease-in-out, transform .6s ease-in-out}
.dstep.big{width:32px;height:32px}
.dstep.done{background:var(--rand)}
.dstep.now{background:var(--akzent);transform:scale(1.15)}
.dgrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.dgrid .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600}
.dgrid .cell .dl{font-size:28px;color:var(--text);transition:color 1s ease-in-out}
.dgrid .cell .ds{font-size:50px;opacity:.8}
.dgrid .cell.glow .dl,.dgrid .cell.glow .ds{color:var(--akzent-text)}
.dgrid .cell.on{background:var(--col);filter:brightness(.9)}
.dprog{height:8px;border-radius:4px;background:var(--rand);overflow:hidden;flex:0 0 auto}
.dprog i{display:block;height:100%;width:0;background:var(--akzent);border-radius:4px;transition:width .8s ease-in-out}

/* ---------- Belohnung (ruhige Sterne) ---------- */
#reward{position:fixed;left:0;right:0;bottom:0;top:var(--bar-h);display:none;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .9s ease-in-out;z-index:50;background:rgba(3,7,10,.72)}
#reward.visible{display:flex}
#reward.show{opacity:1}
#reward .stars{display:flex;gap:18px}
#reward .star{width:78px;height:78px;opacity:0;transform:scale(.85);transition:opacity .9s ease-in-out, transform .9s ease-in-out}
#reward.show .star{opacity:1;transform:scale(1)}
#reward .msg{font-size:34px;margin-top:14px;font-weight:600}
#reward .hud{margin-top:16px;font-size:15px;color:var(--akzent-weich)}
#reward .knoepfe{display:flex;gap:18px;margin-top:22px}
#reward .again{pointer-events:auto;min-height:88px;min-width:260px;padding:0 30px;border-radius:999px;
  background:var(--akzent);color:var(--akzent-text);font-size:27px;font-weight:600;box-shadow:0 0 30px var(--glow)}
#reward .andere{pointer-events:auto;min-height:88px;font-size:24px}

/* ---------- Hinweis-Meldung ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;padding:14px 26px;border-radius:999px;
  background:var(--flaeche2);box-shadow:inset 0 0 0 1px var(--akzent),0 0 24px var(--glow);font-size:19px;
  opacity:0;transition:opacity .8s ease-in-out;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* ---------- niedrige Fenster ---------- */
@media (max-height:720px){
  :root{--tipp:68px;--bar-h:84px}
  #menu{padding-top:10px;gap:10px}
  .kopf h1{font-size:30px}
  .karte{padding:12px 14px}
  .karte .k-ico{width:46px;height:46px}
  .karte .name{font-size:21px}
  .karte .desc{font-size:15px}
  .back{font-size:23px;min-width:140px}
  .bar .title{font-size:21px}
  .bar .title small{font-size:15px}
  .flow{width:50px;height:50px}
  .lied-karte .lt{font-size:18px}
  .stufen{gap:8px;inset:10px 14px 10px}
  .sgrid{bottom:96px}
  .sbottom{height:80px}
  .status{font-size:25px}
  .dgrid .cell .ds{font-size:40px}
  #reward .star{width:64px;height:64px}
  #reward .again,#reward .andere{min-height:72px}
}
@media (max-height:620px){
  :root{--tipp:64px;--bar-h:80px}
  .karte .desc{display:none}
  .kopf h1{font-size:28px}
  .lied-karte .lsterne svg{width:17px;height:17px}
  .stufe-kopf span{font-size:13px}
}
@media (max-width:1100px){
  .bar .ctl{flex-basis:170px;min-width:120px}
  .bar .ctl.tempo-ctl{flex-basis:190px;min-width:140px}
  .bar .val{min-width:50px;font-size:14px}
  .stufe-kopf{flex-basis:100px}
}
</style>
</head>
<body>

<!-- ===================== MENUE ===================== -->
<section id="menu" class="screen active">
  <header class="kopf">
    <h1><span class="eck">&#9698;</span> KRISHNAS SPIELE</h1>
    <div class="kopf-r">
      <span class="hud" id="menuHud">[ BEREIT ]</span>
      <button class="pille" id="fullBtn" aria-label="Vollbild"><span id="fullTxt">Vollbild</span></button>
    </div>
  </header>
  <div class="menu-main">
    <button class="scheibe-btn" data-go="lied" aria-label="Lieder spielen">
      <svg class="ringe" viewBox="0 0 300 300" aria-hidden="true">
        <circle cx="150" cy="150" r="146" fill="none" stroke="var(--rand)" stroke-width="3"/>
        <circle id="menuProg" cx="150" cy="150" r="146" fill="none" stroke="var(--akzent)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="0 917.35" transform="rotate(-90 150 150)" style="transition:stroke-dasharray 1.2s ease-in-out"/>
        <circle class="deko r-a" cx="150" cy="150" r="136" fill="none" stroke="var(--akzent)" stroke-opacity=".55" stroke-width="2.2" stroke-dasharray="33.23 38.0"/>
        <circle class="deko r-b" cx="150" cy="150" r="127" fill="none" stroke="var(--text-dim)" stroke-opacity=".5" stroke-width="5" stroke-dasharray="1.6 20.56"/>
        <circle class="deko r-c" cx="150" cy="150" r="118" fill="none" stroke="var(--akzent)" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="18.54 18.54"/>
      </svg>
      <div class="scheibe">
        <svg class="s-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M18 34V10l20-4v24" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="13" cy="34" r="5.5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="33" cy="30" r="5.5" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        <div class="s-name">Lieder spielen</div>
        <div class="s-sub hud" id="sterneGesamt">[ 0 / 42 STERNE ]</div>
      </div>
    </button>
    <div class="modes">
      <button class="karte glas" data-go="tiles" style="--mark:var(--spur1)">
        <svg class="k-ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/><rect x="13" y="12" width="6" height="14" rx="3" fill="currentColor"/><rect x="21" y="20" width="6" height="14" rx="3" fill="currentColor" fill-opacity=".7"/><rect x="29" y="15" width="6" height="14" rx="3" fill="currentColor" fill-opacity=".45"/></svg>
        <span class="name">Langsame Kacheln</span><span class="desc">Kacheln fallen langsam und warten.</span></button>
      <button class="karte glas" data-go="wait" style="--mark:var(--spur2)">
        <svg class="k-ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/><circle cx="24" cy="24" r="12" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="4.5" fill="currentColor"/></svg>
        <span class="name">Warte-Modus</span><span class="desc">Eine Fläche leuchtet und wartet auf dich.</span></button>
      <button class="karte glas" data-go="simon" style="--mark:var(--spur3)">
        <svg class="k-ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/><circle cx="17" cy="17" r="5" fill="currentColor"/><circle cx="31" cy="17" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="17" cy="31" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="31" cy="31" r="5" fill="currentColor" fill-opacity=".6"/></svg>
        <span class="name">Muster merken</span><span class="desc">Zuhören, anschauen, nachspielen.</span></button>
      <button class="karte glas" data-go="calm" style="--mark:var(--spur4)">
        <svg class="k-ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/><circle cx="19" cy="27" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="30" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="32" cy="31" r="3" fill="currentColor"/></svg>
        <span class="name">Beruhigende Spiele</span><span class="desc">Blasen, Farben und Ringe.</span></button>
      <button class="karte glas" data-go="drum" style="--mark:var(--spur3)">
        <svg class="k-ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/><ellipse cx="24" cy="18" rx="11" ry="4.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M13 18v11c0 2.5 5 4.5 11 4.5s11-2 11-4.5V18" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
        <span class="name">Kuthu-Trommeln</span><span class="desc">Weiche Trommeln, Rhythmus nachspielen.</span></button>
      <button class="karte glas" data-go="einst" style="--mark:var(--text-dim)">
        <svg class="k-ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/><path d="M14 17h20M14 24h20M14 31h20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="17" r="3" fill="currentColor"/><circle cx="29" cy="24" r="3" fill="currentColor"/><circle cx="18" cy="31" r="3" fill="currentColor"/></svg>
        <span class="name">Einstellungen</span><span class="desc">Für Eltern: Ruhe, Begleitung, Freigabe.</span></button>
    </div>
  </div>
  <div class="menu-fuss">
    <div class="vol-box glas">
      <div class="slider-row"><span class="sym" data-ico="vol"></span><input type="range" class="vol" min="0" max="100" step="1" aria-label="Lautstärke"><span class="val vol-val"></span></div>
    </div>
    <footer>Krishnas Spiele &middot; Version 2 &middot; gebaut @ Joschy</footer>
  </div>
</section>

<!-- ===================== LIEDERAUSWAHL ===================== -->
<section id="lieder" class="screen">
  <div class="bar" data-title="Lieder spielen" data-hud="1" data-begl="1" data-tempo="1"></div>
  <div class="stage"><div class="stufen" id="stufen"></div></div>
</section>

<!-- ===================== KACHEL-LIEDER (neu) ===================== -->
<section id="lied" class="screen">
  <div class="bar" data-title="Lieder spielen" data-song="1" data-hud="1" data-flow="1" data-warten="1" data-begl="1" data-tempo="1"></div>
  <div class="stage" id="liedStage"><canvas id="liedCanvas"></canvas></div>
</section>

<!-- ===================== LANGSAME KACHELN ===================== -->
<section id="tiles" class="screen">
  <div class="bar" data-title="Langsame Kacheln" data-song="1" data-tempo="1"></div>
  <div class="stage"><canvas id="tilesCanvas"></canvas></div>
</section>

<!-- ===================== WARTE-MODUS ===================== -->
<section id="wait" class="screen">
  <div class="bar" data-title="Warte-Modus" data-song="1"></div>
  <div class="stage">
    <div class="wgrid" id="wgrid"></div>
    <div class="progress"><i id="waitProg"></i></div>
  </div>
</section>

<!-- ===================== MUSTER MERKEN ===================== -->
<section id="simon" class="screen">
  <div class="bar" data-title="Muster merken"></div>
  <div class="stage">
    <div class="sgrid">
      <button class="sfield" data-i="0" style="--col:var(--spur1)" aria-label="Feld 1"></button>
      <button class="sfield" data-i="1" style="--col:var(--spur2)" aria-label="Feld 2"></button>
      <button class="sfield" data-i="2" style="--col:var(--spur3)" aria-label="Feld 3"></button>
      <button class="sfield" data-i="3" style="--col:var(--spur4)" aria-label="Feld 4"></button>
    </div>
    <div class="sbottom">
      <span class="slen hud" id="simonLen"></span>
      <span class="status" id="simonStatus"></span>
      <button class="pille" id="simonReplay">Nochmal zeigen</button>
    </div>
  </div>
</section>

<!-- ===================== BERUHIGENDE SPIELE ===================== -->
<section id="calm" class="screen">
  <div class="bar" data-title="Beruhigende Spiele" data-tabs="1"></div>
  <div class="stage">
    <canvas id="calmCanvas"></canvas>
    <div class="pads" id="pads"></div>
  </div>
</section>

<!-- ===================== KUTHU-TROMMELN ===================== -->
<section id="drum" class="screen">
  <div class="bar" data-title="Kuthu-Trommeln" data-drum="1"></div>
  <div class="stage">
    <div class="dwrap">
      <div class="drow" id="rhyList"><button class="pille demo" id="drumDemo">Vorspielen</button></div>
      <div class="dsteps" id="dsteps"></div>
      <div class="dgrid" id="dgrid"></div>
      <div class="dprog"><i id="drumProg"></i></div>
    </div>
  </div>
</section>

<!-- ===================== EINSTELLUNGEN ===================== -->
<section id="einst" class="screen">
  <div class="bar" data-title="Einstellungen" data-hud="1"></div>
  <div class="stage">
    <div class="einst-grid">
      <div class="eblock glas">
        <span class="hud">&#9698; Begleitung (Bass, Trommel, Akkorde)</span>
        <div class="ezeile">
          <button class="pille tgl-begl" style="min-width:150px"></button>
          <div class="slider-row"><span class="sym" data-ico="vol"></span><input type="range" class="beglvol" min="0" max="100" step="5" aria-label="Lautstärke Begleitung"><span class="val beglvol-val"></span></div>
        </div>
      </div>
      <div class="eblock glas">
        <span class="hud">&#9698; Ton-Ausgleich (Verzögerung des Tablets)</span>
        <div class="ezeile">
          <div class="slider-row"><span class="hud" style="width:50px">früh</span><input type="range" class="ausgleich" min="-150" max="150" step="10" aria-label="Ton-Ausgleich"><span class="val ausgleich-val"></span></div>
        </div>
      </div>
      <div class="eblock glas">
        <span class="hud">&#9698; Ruhe-Modus (Bewegung im Menü)</span>
        <div class="ezeile" id="ruheWahl">
          <button class="pille" data-ruhe="voll">voll</button>
          <button class="pille" data-ruhe="sparsam">sparsam</button>
          <button class="pille" data-ruhe="aus">aus</button>
        </div>
        <span class="ehinweis" id="ruheHinweis"></span>
      </div>
      <div class="eblock glas">
        <span class="hud">&#9698; Lieder-Freigabe</span>
        <div class="ezeile">
          <button class="pille" id="alleFreiBtn"></button>
          <span class="ehinweis">Sonst wird eine Stufe ab 6 Sternen der Stufe davor frei.</span>
        </div>

const ALTE_LIEDER = [];

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, H: 11 };
const TON_RE = /^([A-Ha-h])(#|b)?(\d)?$/;
function tonNorm(t) {
  const m = TON_RE.exec(String(t).trim());
  if (!m) throw new Error('Unbekannter Ton: ' + t);
  return m[1].toUpperCase() + (m[2] || '') + (m[3] != null ? m[3] : '4');
}
function tonMidi(t) {
  const m = TON_RE.exec(String(t).trim());
  if (!m) return 60;
  let n = NOTE_IDX[m[1].toUpperCase()];
  if (m[2] === '#') n += 1;
  if (m[2] === 'b') n -= 1;
  return (parseInt(m[3] != null ? m[3] : '4', 10) + 1) * 12 + n;
}
function parseMelodie(str) {
  const noten = [], takte = [];
  let beat = 0, taktStart = 0;
  str.split(/\s+/).filter(Boolean).forEach(tok => {
    if (tok === '|') { takte.push(+(beat - taktStart).toFixed(4)); taktStart = beat; return; }
    const m = /^([^_/]+)(?:([_/])([\d.]+))?$/.exec(tok);
    if (!m) throw new Error('Unbekanntes Zeichen: ' + tok);
    const len = m[3] ? parseFloat(m[3]) : 1, kopf = m[1];
    if (kopf === '-') { /* stille Pause */ }
    else if (kopf === '~') noten.push([beat, null, len, 'ruhe']);
    else {
      const teile = kopf.split('+');
      if (teile.length > 1) noten.push([beat, tonNorm(teile[0]), len, 'doppel', tonNorm(teile[1])]);
      else if (m[2] === '_') noten.push([beat, tonNorm(kopf), len, 'lang']);
      else noten.push([beat, tonNorm(kopf), len]);
    }
    beat += len;
  });
  if (beat > taktStart) takte.push(+(beat - taktStart).toFixed(4));
  return { noten, laenge: beat, takte };
}

  return { id: 'alt' + i, titel: alt.name, stufe: 1, tonleiter: 'Dur', bpm: 56, herkunft: 'aus Version 1',

function liedVorbereiten(l) {
  if (!l.noten) { const p = parseMelodie(l.melodie); l.noten = p.noten; l.laenge = p.laenge; l._takte = p.takte; }
  if (!l.laenge) l.laenge = l.noten.reduce((a, n) => Math.max(a, n[0] + n[2]), 0);
  l.takt = l.takt || 4;
  l.spuren = l.spuren || (l.stufe === 1 ? 3 : 4);
  /* Spur aus der Tonhoehe: tiefe Toene links, hohe rechts; nach Haeufigkeit
     verteilt, damit alle Spuren ungefaehr gleich oft drankommen */
  const anzahl = {};
  let summe = 0;
  l.noten.forEach(n => { [n[1], n[4]].forEach(t => { if (t) { const m = tonMidi(t); anzahl[m] = (anzahl[m] || 0) + 1; summe++; } }); });
  const spurTab = {};
  let kum = 0;
  const toene = Object.keys(anzahl).map(Number).sort((a, b) => a - b);
  toene.forEach((m, r) => {
    const lage = 0.5 * (r + 0.5) / toene.length + 0.5 * (kum + anzahl[m] / 2) / summe;   /* Mischung Rang/Haeufigkeit */
    spurTab[m] = Math.min(l.spuren - 1, Math.floor(lage * l.spuren)); kum += anzahl[m];
  });
  const spurVon = m => spurTab[m];
  l.kacheln = [];
  l.noten.forEach(n => {
    const [beat, ton, len, art, zweit] = n;
    if (art === 'ruhe') { l.kacheln.push({ beat, len, ton: null, art: 'ruhe', spur: -1 }); return; }
    const s1 = spurVon(tonMidi(ton));
    if (art === 'doppel' && zweit) {
      let s2 = spurVon(tonMidi(zweit));
      if (s2 === s1) s2 = s1 + 1 < l.spuren ? s1 + 1 : s1 - 1;
      const a = { beat, len, ton, art: 'doppel', spur: s1 }, b = { beat, len, ton: zweit, art: 'doppel', spur: s2, zweit: true };
      a.partner = b; b.partner = a;
      l.kacheln.push(a, b);
    } else l.kacheln.push({ beat, len, ton, art: art === 'lang' ? 'lang' : 'kurz', spur: s1 });
  });

}

function liedPruefen(l) {
  const p = [], st = l.stufe;
  (l._takte || []).forEach((t, i) => { if (Math.abs(t - l.takt) > 1e-6) p.push('Takt ' + (i + 1) + ' hat ' + t + ' Schläge'); });
  const tl = TONLEITERN[l.tonleiter];
  if (!tl) p.push('Unbekannte Tonleiter ' + l.tonleiter);
  l.noten.forEach(n => {
    [n[1], n[4]].forEach(t => {
      if (!t) return;
      const m = tonMidi(t);
      if (m < 48 || m > 76) p.push('Ton ausserhalb C3-E5: ' + t);
      if (tl && tl.pc.indexOf(((m % 12) + 12) % 12) < 0) p.push('Ton ' + t + ' nicht in ' + l.tonleiter);
    });
    if (st === 1 && n[3]) p.push('Stufe 1 erlaubt nur kurze Kacheln (' + n[3] + ')');
    if (st === 2 && n[3] === 'doppel') p.push('Doppel erst ab Stufe 3');
  });
  l.kacheln.forEach(k => { if (k.partner && k.partner.spur === k.spur) p.push('Doppel in gleicher Spur bei Schlag ' + k.beat); });
  for (let i = 0; i < l.spuren; i++) if (!l.kacheln.some(k => k.spur === i)) p.push('Spur ' + (i + 1) + ' wird nie benutzt');
  const grenzen = { 1: [50, 60, 30, 45], 2: [60, 70, 45, 70], 3: [70, 80, 60, 90] }[st];
  if (grenzen) {
    if (l.bpm < grenzen[0] || l.bpm > grenzen[1]) p.push('bpm ' + l.bpm + ' passt nicht zu Stufe ' + st);
    if (l.sekunden < grenzen[2] - 0.5 || l.sekunden > grenzen[3] + 0.5) p.push('Länge ' + l.sekunden.toFixed(1) + ' s passt nicht zu Stufe ' + st);
  }
  return p;
}

/* ---------------- Belohnung: Sterne, ruhig ---------------- */
const reward = $('#reward');
let rewardTimer = 0;
function showReward(opt) {
  clearTimeout(rewardTimer);
  const n = opt.sterne == null ? 3 : opt.sterne;
  const box = $('.stars', reward);
  box.innerHTML = [0, 1, 2].map(i => sternSvg(i < n, 'star')).join('');
  $$('.star', box).forEach((s, i) => { s.style.transitionDelay = (0.2 + i * 0.25) + 's'; });
  $('.msg', reward).textContent = opt.msg || '';
  $('.hud', reward).textContent = opt.hud || '';
  const btn = $('.again', reward), andere = $('.andere', reward);
  btn.style.display = opt.again ? '' : 'none';
  btn.onclick = opt.again ? () => { hideReward(); opt.again(); } : null;
  andere.style.display = opt.andere ? '' : 'none';
  andere.onclick = opt.andere ? () => { hideReward(); opt.andere(); } : null;
  reward.classList.add('visible');
  void reward.offsetWidth;          /* Reflow, damit das Einblenden sanft laeuft */
  reward.classList.add('show');
  chime();
  if (!opt.again && !opt.andere) rewardTimer = setTimeout(hideReward, 2600);
}
function hideReward() {
  clearTimeout(rewardTimer);
  reward.classList.remove('show');
  $('.again', reward).onclick = null; $('.andere', reward).onclick = null;
  rewardTimer = setTimeout(() => reward.classList.remove('visible'), 950);
}

/* Sanfte Welle beim Antippen */
function ripple(el, e) {
  const r = el.getBoundingClientRect();
  const sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.left = ((e && e.clientX != null ? e.clientX : r.left + r.width / 2) - r.left) + 'px';
  sp.style.top = ((e && e.clientY != null ? e.clientY : r.top + r.height / 2) - r.top) + 'px';
  el.appendChild(sp);
  setTimeout(() => sp.remove(), 1200);
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fitCanvas(cv, ctx) {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { W: r.width, H: r.height };
}
const cssVar = n => { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch (e) { return ''; } };

/* ================================================================
   LIEDERAUSWAHL (fuer Lieder spielen, Langsame Kacheln, Warte-Modus)
   ================================================================ */
let pickZiel = 'lied';
const STUFEN_INFO = { 1: '3 Spuren · kurze Kacheln', 2: '4 Spuren · lange Kacheln, Ruhe', 3: '4 Spuren · Doppel-Kacheln' };

  const box = $('#stufen');

  $('#lieder .t-name').textContent = titel;
  $('#lieder .bar-hud').textContent = '[ LIED WÄHLEN ]';
  $$('#lieder .tgl-begl').forEach(b => { b.style.display = pickZiel === 'lied' ? '' : 'none'; });
  box.innerHTML = '';
  [1, 2, 3].forEach(st => {
    const frei = pickZiel !== 'lied' || stufeFrei(st);
    const row = document.createElement('div'); row.className = 'stufe';
    const fehlt = Math.max(0, 6 - sterneStufe(st - 1));
    row.innerHTML = '<div class="stufe-kopf"><b>STUFE ' + st + '</b><span>' + STUFEN_INFO[st] + '</span>' +
      (frei ? '' : '<span>noch ' + fehlt + ' Sterne aus Stufe ' + (st - 1) + '</span>') + '</div><div class="lied-reihe"></div>';
    const reihe = $('.lied-reihe', row);
    LIEDER.filter(l => l.stufe === st).forEach(l => {
      const b = document.createElement('button');
      b.className = 'lied-karte glas' + (frei ? '' : ' zu');
      b.dataset.id = l.id;
      b.style.setProperty('--mark', 'var(--spur' + st + ')');
      const s = sterneVon(l.id);
      b.innerHTML = '<span class="lt">' + l.titel + '</span><span class="ls">' + TONLEITERN[l.tonleiter].name + '</span>' +
        '<span class="lsterne">' + [0, 1, 2].map(i => sternSvg(i < s)).join('') + '</span>' + (frei ? '' : '<span class="schloss">' + ICON.lock + '</span>');
      b.addEventListener('click', () => {
        if (!frei) { hintTone(); toast('Diese Stufe wird mit ' + fehlt + ' weiteren Sternen aus Stufe ' + (st - 1) + ' frei.'); return; }

function openPicker(ziel) { pickZiel = ziel; show('lieder'); }

/* ================================================================
   MODUS 1 (NEU): LIEDER SPIELEN - Kachel-Lieder
   Kacheln fallen in 3 oder 4 Spuren. Jeder Tipp spielt den naechsten Ton.
   Kein Game Over, kein Punktabzug, Tempo steigt nie von selbst.
   Takt 1-4 laufen mit halbem Tempo, danach das gewaehlte Tempo.
   Zeit wird in Schlaegen gerechnet (pos), nicht in Sekunden.
   ================================================================ */
const Lied = (() => {
  const cv = $('#liedCanvas'), ctx = cv.getContext('2d');
  const flowEl = $('#lied .flow-ring'), hudEl = $('#lied .bar-hud');
  let W = 0, H = 0, raf = 0, last = 0, running = false;
  let lied = null, kacheln = [], ev = [], evIdx = 0, pos = 0, vorlauf = 4, dueIdx = 0;
  let waiting = false, waitSince = 0, finished = false, hits = 0, total = 0;
  let flow = 0, flowZiel = 0, shimmer = { spur: -1, t: -9 }, holds = new Map(), drone = null, hudText = '', erstTipp = true;

  function resize() { const s = fitCanvas(cv, ctx); W = s.W; H = s.H; }
  function geo() {
    const n = lied.spuren, mx = Math.max(14, W * 0.04);
    const laneW = (W - 2 * mx) / n;
    const zone = clamp(H * 0.2, 70, 120);
    return { n, mx, laneW, lineY: H - zone, zone, ppb: clamp(H * 0.21, 80, 170) };
  }
  function bpsAt(p) {
    let f = 1;
    if (p < 12) f = 0.5;
    else if (p < 16) { const a = (p - 12) / 4; f = 0.5 + 0.5 * a * a * (3 - 2 * a); }
    return lied.bpm / 60 * tempoFaktor() * f;
  }
  const fenster = () => (lied.stufe === 1 ? 0.6 : lied.stufe === 2 ? 0.45 : 0.3);
  const wartenAn = () => !!settings.warten[lied.stufe];
  const tippbar = k => k.art !== 'ruhe';
  function due() {
    while (dueIdx < kacheln.length && (!tippbar(kacheln[dueIdx]) || kacheln[dueIdx].hit || kacheln[dueIdx].missed)) dueIdx++;
    return kacheln[dueIdx] || null;
  }
  function buildEvents() {
    const e = [], bg = lied.begleitung || {};
    const akk = bg.akkorde && bg.akkorde.length ? bg.akkorde : ['C'];
    const pat = TROMMEL[bg.trommel] || TROMMEL['kuthu-1'];
    for (let b = -vorlauf; b < 0; b++) e.push({ beat: b, typ: 'drum', k: 'T', v: (b + vorlauf) % 4 === 0 ? 0.28 : 0.16 });
    const takte = Math.ceil(lied.laenge / 4);
    for (let t = 0; t < takte; t++) {
      const b0 = t * 4, ch = akkord(akk[t % akk.length]);
      e.push({ beat: b0, typ: 'pad', ch, len: 4 });
      e.push({ beat: b0, typ: 'bass', m: ch.bass, len: 1.7 });
      e.push({ beat: b0 + 2, typ: 'bass', m: ch.bass2, len: 1.7 });
      for (let s = 0; s < 16; s++) {
        const c = pat[s];
        if (c === 'X') e.push({ beat: b0 + s / 4, typ: 'drum', k: 'D', v: 0.5 });
        else if (c === 'x') e.push({ beat: b0 + s / 4, typ: 'drum', k: 'T', v: 0.24 });
      }
    }
    e.push({ beat: takte * 4, typ: 'pad', ch: akkord('C5'), len: 3 });
    e.push({ beat: takte * 4, typ: 'bass', m: 36, len: 2.5 });
    e.sort((a, b) => a.beat - b.beat);
    return e;
  }
  function schedule(bps, limit) {
    while (evIdx < ev.length && ev[evIdx].beat <= limit) {
      const e = ev[evIdx++];
      if (e.beat < pos - 0.08 || !actx || !accBus || !settings.begleitung) continue;
      const t = actx.currentTime + 0.02 + Math.max(0, (e.beat - pos) / bps);
      if (e.typ === 'drum') playDrum(e.k, e.v, t, accBus);
      else if (e.typ === 'pad') padAt(e.ch.pad, t, e.len / bps);
      else if (e.typ === 'bass') bassAt(e.m, t, e.len / bps);
    }
  }
  function start() {
    lied = aktLied(); resize(); spurFarbenLesen();
    kacheln = lied.kacheln.map(k => Object.assign({}, k, { hit: false, missed: false, seen: 0, hitT: 0, held: false, holdEnd: null }));
    kacheln.forEach(k => { if (k.partner) k.partner = null; });
    for (let i = 0; i < kacheln.length; i++) if (kacheln[i].art === 'doppel' && !kacheln[i].zweit) {
      const b = kacheln.find(x => x.zweit && x.beat === kacheln[i].beat); if (b) { kacheln[i].partner = b; b.partner = kacheln[i]; }
    }
    total = kacheln.filter(tippbar).length; hits = 0;
    const g = geo();
    vorlauf = 4 * Math.max(1, Math.ceil(g.lineY / g.ppb / 4));
    pos = -vorlauf; dueIdx = 0; waiting = false; finished = false; erstTipp = true;
    flow = 0; flowZiel = 0; shimmer = { spur: -1, t: -9 }; hudText = '';
    holds.forEach(h => h.ton.stop()); holds.clear();
    if (drone) { drone.stop(); drone = null; }
    ev = buildEvents(); evIdx = 0;
    running = true; last = 0;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    syncUI();
  }
  function stop() {
    running = false; cancelAnimationFrame(raf);
    holds.forEach(h => h.ton.stop()); holds.clear();
    if (drone) { drone.stop(); drone = null; }
  }
  function finish() {
    finished = true;
    holds.forEach(h => h.ton.stop()); holds.clear();
    if (drone) { drone.stop(); drone = null; }
    const quote = total ? hits / total : 1;
    const sterne = quote >= 0.85 ? 3 : quote >= 0.6 ? 2 : 1;
    if (sterne > sterneVon(lied.id)) { settings.sterne[lied.id] = sterne; saveSettings(); }
    syncUI();
    const msg = sterne === 3 ? 'Wunderbar gespielt!' : sterne === 2 ? 'Schön gespielt!' : 'Lied geschafft!';
    setTimeout(() => {
      if (!running) return;
      showReward({ sterne, msg, hud: '[ LIED FERTIG ]', again: () => start(), andere: () => openPicker('lied') });
    }, 700);
  }
  function setHud(t) { if (t !== hudText) { hudText = t; hudEl.textContent = t; } }

  function frame(ts) {
    if (!running) return;
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts;
    const now = ts / 1000;
    if (!finished) {
      const bps = bpsAt(pos);
      let np = pos + dt * bps;
      const d = due();
      if (wartenAn() && d && np >= d.beat) {
        np = d.beat;
        if (!waiting) { waiting = true; waitSince = now; }
      } else waiting = false;
      pos = np;
      if (!wartenAn()) {
        const fb = fenster() * bps, jp = pos - settings.ausgleich / 1000 * bps;
        for (let i = dueIdx; i < kacheln.length && kacheln[i].beat < jp - fb; i++) {
          const k = kacheln[i];
          if (tippbar(k) && !k.hit && !k.missed) { k.missed = true; flowZiel = Math.max(0, flowZiel - 0.2); }
        }
      }
      holds.forEach((h, id) => { if (pos >= h.k.beat + h.k.len) { h.ton.stop(); h.k.holdEnd = h.k.beat + h.k.len; holds.delete(id); } });
      /* Begleitung: kurzer Vorlauf, beim Warten nicht ueber die wartende Kachel hinaus */
      let limit = pos + 0.18 * bps;
      if (wartenAn() && d) limit = Math.min(limit, d.beat - 1e-6);
      schedule(bps, limit);
      if (waiting && !drone && now - waitSince > 0.5 && settings.begleitung && actx) {
        const bg = lied.begleitung || {}, akk = bg.akkorde || ['C'];
        drone = startDrone(akkord(akk[Math.max(0, Math.floor(pos / 4)) % akk.length]).pc);
      }
      if (!waiting && drone) { drone.stop(); drone = null; }
      if (!due() && pos >= lied.laenge + 1.5) finish();
      const takt = Math.floor(pos / 4) + 1, alle = Math.ceil(lied.laenge / 4);
      setHud(pos < 0 ? '[ GLEICH GEHT ES LOS ]' : waiting ? '[ WARTET AUF DICH ]' : '[ TAKT ' + Math.min(takt, alle) + ' / ' + alle + ' ]');
    }
    /* Fluss-Ring: steigt sanft, faellt langsam (ca. 2 s) */
    const rate = flowZiel > flow ? 1 / 0.8 : 1 / 2;
    flow += clamp(flowZiel - flow, -rate * dt, rate * dt);
    flowEl.setAttribute('stroke-dashoffset', (FLOW_U * (1 - flow)).toFixed(2));
    draw(now);
    raf = requestAnimationFrame(frame);
  }

  function draw(now) {
    const g = geo(), n = g.n, cs = SPUR_FARBEN;
    ctx.clearRect(0, 0, W, H);
    /* Spuren */
    for (let l = 0; l < n; l++) {
      const x = g.mx + l * g.laneW;
      ctx.globalAlpha = 0.05; ctx.fillStyle = cs[l];
      ctx.fillRect(x + 4, 0, g.laneW - 8, H);
      ctx.globalAlpha = 0.5; ctx.fillStyle = cssVar('--rand') || '#1d3a40';
      if (l > 0) ctx.fillRect(x - 0.5, 0, 1, H);
      /* sanfter Schimmer auf der richtigen Spur (nach Fehltipp, 800 ms) */
      if (shimmer.spur === l) {
        const a = (now - shimmer.t) / 0.8;
        if (a >= 0 && a < 1) {
          const gr = ctx.createLinearGradient(0, g.lineY - g.ppb * 2.5, 0, H);
          gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, cs[l]);
          ctx.globalAlpha = 0.22 * Math.sin(Math.PI * a); ctx.fillStyle = gr;
          ctx.fillRect(x + 4, g.lineY - g.ppb * 2.5, g.laneW - 8, H);
        }
      }
      /* Ziel-Ring an der Trefferlinie */
      const r = Math.min(g.laneW * 0.2, g.zone * 0.36);
      ctx.globalAlpha = 0.45; ctx.strokeStyle = cs[l]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x + g.laneW / 2, g.lineY + g.zone / 2, r, 0, Math.PI * 2); ctx.stroke();
    }
    /* Trefferlinie */
    ctx.globalAlpha = 0.55; ctx.fillStyle = cssVar('--akzent') || '#2ee6d6';
    ctx.fillRect(g.mx, g.lineY - 1, W - 2 * g.mx, 2);
    ctx.globalAlpha = 0.08; ctx.fillRect(g.mx, g.lineY, W - 2 * g.mx, g.zone);

    const d = finished ? null : due();
    const atem = 0.5 + 0.5 * Math.sin(now * Math.PI * 0.8);
    for (let i = 0; i < kacheln.length; i++) {
      const k = kacheln[i];
      const yb = g.lineY - (k.beat - pos) * g.ppb;              /* unterer Rand der Kachel */
      const hLen = k.art === 'lang' ? Math.max(g.ppb * 0.8, k.len * g.ppb - 10) : Math.min(1, k.len) * g.ppb * 0.8;
      if (yb - hLen > H) continue;
      if (yb < -10) break;
      if (!k.seen) k.seen = now;
      let alpha = Math.min(1, (now - k.seen) / 0.8);          /* sanft einblenden */
      if (k.art === 'ruhe') {
        const cy = yb - k.len * g.ppb / 2, r = Math.min(k.len * g.ppb * 0.38, g.laneW * 0.55, 70);
        ctx.globalAlpha = 0.4 * alpha; ctx.strokeStyle = cssVar('--text-dim') || '#86a9ad'; ctx.lineWidth = 2;
        ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.arc(W / 2, cy, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = 0.55 * alpha; ctx.fillStyle = cssVar('--text-dim') || '#86a9ad';
        ctx.font = '600 20px ' + (cssVar('--fh') || 'sans-serif'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('atmen', W / 2, cy);
        continue;
      }
      const col = cs[k.spur];
      const x = g.mx + k.spur * g.laneW + 10, w = g.laneW - 20;
      let grow = 0;
      if (k.hit && k.art !== 'lang') {
        const a = (now - k.hitT) / 0.7;
        if (a >= 1) continue;
        alpha = 0.6 * (1 - a); grow = a * 10;
      }
      if (k.missed) alpha *= 0.35;
      const top = k.hit && k.art !== 'lang' ? g.lineY - hLen : yb - hLen;
      const bot = top + hLen;
      /* Doppel: Verbindungslinie */
      if (k.art === 'doppel' && !k.zweit && k.partner && !k.hit) {
        const x2 = g.mx + k.partner.spur * g.laneW + g.laneW / 2;
        ctx.globalAlpha = 0.5 * alpha; ctx.strokeStyle = cssVar('--akzent-weich') || '#7ff5ea'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x + w / 2, top + hLen / 2); ctx.lineTo(x2, top + hLen / 2); ctx.stroke();
      }
      ctx.globalAlpha = (k.art === 'lang' ? 0.2 : 0.26) * alpha; ctx.fillStyle = col;
      roundRect(ctx, x - grow, top - grow, w + 2 * grow, hLen + 2 * grow, k.art === 'lang' ? Math.min(w / 2, 40) : 22); ctx.fill();
      ctx.globalAlpha = 0.9 * alpha; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
      /* Ring in der Kachel */
      const rr = Math.max(6, Math.min(w * 0.24, Math.min(hLen, g.ppb * 0.8) * 0.3));
      const cx = x + w / 2, cy = bot - Math.min(hLen, g.ppb * 0.8) / 2;
      ctx.lineWidth = 3; ctx.globalAlpha = 0.85 * alpha;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
      if (k.art === 'lang' && k.hit) {
        const ende = k.holdEnd != null ? k.holdEnd : pos;
        const p = clamp((ende - k.beat) / k.len, 0, 1);
        ctx.lineWidth = 6; ctx.globalAlpha = 0.95;
        ctx.beginPath(); ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 0.18; ctx.fillStyle = col;
        roundRect(ctx, x, Math.max(top, bot - hLen * p), w, hLen * p, Math.min(w / 2, 40)); ctx.fill();
      } else if (k.art === 'lang') {
        ctx.globalAlpha = 0.5 * alpha; ctx.font = '600 15px ' + (cssVar('--fm') || 'monospace');
        ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (hLen > g.ppb * 1.3) ctx.fillText('HALTEN', cx, top + 22);
      }
      if (k === d || (d && k.partner === d)) {   /* naechste Kachel: ruhig atmender Rand */
        ctx.globalAlpha = 0.25 + 0.35 * atem; ctx.strokeStyle = cssVar('--akzent-weich') || '#7ff5ea'; ctx.lineWidth = 4;
        roundRect(ctx, x - 5, top - 5, w + 10, hLen + 10, 26); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    /* Fortschritt oben */
    ctx.fillStyle = cssVar('--rand') || '#1d3a40'; ctx.fillRect(0, 0, W, 4);
    ctx.fillStyle = cssVar('--akzent') || '#2ee6d6'; ctx.fillRect(0, 0, W * clamp(pos / lied.laenge, 0, 1), 4);
    if (erstTipp && !finished) {
      ctx.globalAlpha = 0.75; ctx.fillStyle = cssVar('--text') || '#dff7f4';
      ctx.font = '600 26px ' + (cssVar('--fh') || 'sans-serif'); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(wartenAn() ? 'Tippe die Kachel, wenn sie unten ankommt' : 'Tippe die Kacheln an der Linie', W / 2, 46);
      ctx.globalAlpha = 1;
    }
  }

  function spurAus(e) {
    const r = cv.getBoundingClientRect(), g = geo();
    return clamp(Math.floor((e.clientX - r.left - g.mx) / g.laneW), 0, g.n - 1);
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running || finished) return;
    const spur = spurAus(e), bps = bpsAt(pos);
    const jp = pos - settings.ausgleich / 1000 * bps, fb = fenster() * bps;
    let best = null, bd = 1e9;
    for (let i = dueIdx; i < kacheln.length; i++) {
      const k = kacheln[i];
      if (k.beat > jp + fb) break;
      if (k.spur !== spur || !tippbar(k) || k.hit || k.missed) continue;
      const dd = Math.abs(k.beat - jp);
      if (dd <= fb && dd < bd) { best = k; bd = dd; }
    }
    if (best) {
      best.hit = true; best.hitT = nowSec(); hits++; erstTipp = false;
      flowZiel = Math.min(1, flowZiel + 0.08);
      const f = noteFreq(best.ton);
      if (best.art === 'lang') {
        try { cv.setPointerCapture(e.pointerId); } catch (x) {}
        holds.set(e.pointerId, { k: best, ton: startHold(f, 0.9) });
      } else playFreq(f, 0.9, 1.7);
    } else {
      /* Fehltipp: nur leiser Ton und sanfter Schimmer auf der richtigen Spur. Kein Abzug. */
      hintTone();
      const d = due();
      shimmer = { spur: d ? d.spur : spur, t: nowSec() };
      flowZiel = Math.max(0, flowZiel - 0.1);
    }
  });
  function loslassen(e) {
    const h = holds.get(e.pointerId);
    if (h) { h.ton.stop(); h.k.holdEnd = pos; holds.delete(e.pointerId); }
  }
  cv.addEventListener('pointerup', loslassen);
  cv.addEventListener('pointercancel', loslassen);
  cv.addEventListener('lostpointercapture', loslassen);

  return {
    start, stop,
    resize() { if (running) resize(); },
    /* nur fuer automatische Tests: liest den Zustand, aendert nichts */
    zustand() {
      if (!lied) return null;
      const g = geo(), d = finished ? null : due(), r = cv.getBoundingClientRect();
      return { pos, waiting, finished, hits, total, laenge: lied.laenge, spuren: g.n,
        due: d ? { spur: d.spur, beat: d.beat, art: d.art } : null,
        spurX: Array.from({ length: g.n }, (_, i) => r.left + g.mx + (i + 0.5) * g.laneW), tippY: r.top + g.lineY + g.zone / 2 };
    }
  };
})();

/* ================================================================
   MODUS 2: LANGSAME KACHELN (aus Version 1)
   Kacheln fallen langsam. Erreicht die naechste Kachel unten die Linie,
   bleibt sie stehen und wartet. Kein Verlieren.
   ================================================================ */
const Tiles = (() => {
  const cv = $('#tilesCanvas'), ctx = cv.getContext('2d');
  let W = 0, H = 0, raf = 0, last = 0, running = false;
  let tiles = [], next = 0, scroll = 0, hintUntil = 0, done = false;

  function resize() { const s = fitCanvas(cv, ctx); W = s.W; H = s.H; }
  function geo() {
    const tileH = Math.max(110, H * 0.24);
    const gap = tileH * 0.35;
    return { tileH, step: tileH + gap, stopY: H - 18, startY: H * 0.45, laneW: W / 4 };
  }
  function build() {
    const notes = liedToene(aktLied());
    tiles = []; let prev = -1;
    for (let i = 0; i < notes.length; i++) {
      let l; do { l = Math.floor(Math.random() * 4); } while (l === prev);
      prev = l;
      tiles.push({ lane: l, note: notes[i], hit: false, hitT: 0 });
    }
    next = 0; scroll = 0; done = false; hintUntil = 0;
  }
  const bottomOf = (i, g) => g.startY + scroll - i * g.step;
  /* Tempo 1 = sehr langsam ... Tempo 10 = zuegig (immer noch ruhig) */
  const speed = () => H * (0.03 + (settings.tempo - 1) * 0.03);

  function frame(ts) {
    if (!running) return;
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts;
    const g = geo();
    if (!done) {
      scroll += speed() * dt;
      const maxScroll = g.stopY - g.startY + next * g.step;
      if (scroll > maxScroll) scroll = maxScroll;
    }
    draw(ts / 1000, g);
    raf = requestAnimationFrame(frame);
  }
  function draw(now, g) {
    const cs = SPUR_FARBEN;
    ctx.clearRect(0, 0, W, H);
    for (let l = 0; l < 4; l++) {
      ctx.globalAlpha = l % 2 ? 0.04 : 0.07; ctx.fillStyle = cs[l];
      ctx.fillRect(l * g.laneW, 0, g.laneW, H);
    }
    ctx.globalAlpha = 0.07; ctx.fillStyle = cssVar('--akzent') || '#2ee6d6';
    ctx.fillRect(0, g.stopY - g.tileH, W, g.tileH);
    for (let i = Math.max(0, next - 4); i < tiles.length; i++) {
      const t = tiles[i];
      const b = bottomOf(i, g), top = b - g.tileH;
      if (b < 0) break;
      if (top > H) continue;
      const x = t.lane * g.laneW + 10, w = g.laneW - 20;
      let alpha = 1, grow = 0;
      if (t.hit) {
        const a = (now - t.hitT) / 0.8;
        if (a >= 1) continue;
        alpha = 0.55 * (1 - a); grow = a * 12;
      }
      ctx.globalAlpha = 0.3 * alpha; ctx.fillStyle = cs[t.lane];
      roundRect(ctx, x - grow, top - grow, w + 2 * grow, g.tileH + 2 * grow, 24); ctx.fill();
      ctx.globalAlpha = 0.9 * alpha; ctx.strokeStyle = cs[t.lane]; ctx.lineWidth = 3; ctx.stroke();
      if (i === next && !t.hit) {
        const p = 0.5 + 0.5 * Math.sin(now * Math.PI * 0.8);
        const hint = now < hintUntil;
        const e = hint ? 4 + 8 * (0.5 + 0.5 * Math.sin(now * Math.PI * 1.2)) : 0;
        ctx.globalAlpha = 0.35 + 0.3 * p;
        ctx.strokeStyle = cssVar('--akzent-weich') || '#7ff5ea'; ctx.lineWidth = 5;
        roundRect(ctx, x - 4 - e, top - 4 - e, w + 8 + 2 * e, g.tileH + 8 + 2 * e, 26); ctx.stroke();
        ctx.globalAlpha = 0.5 + 0.25 * p; ctx.strokeStyle = cs[t.lane]; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x + w / 2, top + g.tileH / 2, Math.min(w, g.tileH) * 0.16, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = cssVar('--rand') || '#1d3a40'; ctx.fillRect(0, 0, W, 6);
    ctx.fillStyle = cssVar('--akzent') || '#2ee6d6'; ctx.fillRect(0, 0, W * (tiles.length ? next / tiles.length : 0), 6);
    if (next === 0) {
      ctx.globalAlpha = 0.85; ctx.fillStyle = cssVar('--text') || '#dff7f4';
      ctx.font = '600 28px ' + (cssVar('--fh') || 'sans-serif'); ctx.textAlign = 'center';
      ctx.fillText('Tippe auf die leuchtende Kachel', W / 2, 56); ctx.globalAlpha = 1;
    }
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running || done) return;
    const r = cv.getBoundingClientRect();
    const g = geo();
    const lane = clamp(Math.floor((e.clientX - r.left) / g.laneW), 0, 3);
    const t = tiles[next]; if (!t) return;
    const visible = bottomOf(next, g) > g.tileH * 0.35;
    if (lane === t.lane && visible) {
      t.hit = true; t.hitT = nowSec();
      playNote(t.note);
      next++;
      if (next >= tiles.length) {
        done = true;
        setTimeout(() => { if (running) showReward({ msg: 'Super gespielt!', again: () => build(), andere: () => openPicker('tiles') }); }, 900);
      }
    } else {
      hintTone();
      hintUntil = nowSec() + 2.8;
    }
  });
  return {
    start() { spurFarbenLesen(); resize(); build(); running = true; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) resize(); }
  };
})();

/* ================================================================
   MODUS 3: WARTE-MODUS
   Eine Flaeche leuchtet sanft und wartet beliebig lange.
   ================================================================ */
const Wait = (() => {
  const grid = $('#wgrid'), prog = $('#waitProg');
  const COLS = ['var(--spur1)', 'var(--spur2)', 'var(--spur3)', 'var(--spur4)', 'var(--spur2)', 'var(--spur4)', 'var(--spur1)', 'var(--spur3)'];
  const cells = COLS.map((c, i) => {
    const d = document.createElement('button');
    d.className = 'cell'; d.style.setProperty('--col', c);
    d.setAttribute('aria-label', 'Fläche ' + (i + 1));
    d.addEventListener('pointerdown', e => { e.preventDefault(); tap(i, e); });
    grid.appendChild(d);
    return d;
  });
  let active = -1, idx = 0, notes = [], busy = false, running = false, hintTimer = 0;
  function setActive(n) {
    cells.forEach(c => c.classList.remove('glow', 'hint'));
    active = n;
    if (n >= 0) cells[n].classList.add('glow');
  }
  function pick() {
    let n; do { n = Math.floor(Math.random() * cells.length); } while (n === active);
    setActive(n);
  }
  function updateProgress() { prog.style.width = (notes.length ? 100 * idx / notes.length : 0) + '%'; }
  function reset() {
    notes = liedToene(aktLied()); idx = 0; busy = false; active = -1;
    updateProgress(); pick();
  }
  function tap(i, e) {
    if (!running || busy || active < 0) return;
    if (i === active) {
      playNote(notes[idx]);
      ripple(cells[i], e);
      idx++; updateProgress();
      busy = true;
      cells[i].classList.remove('glow', 'hint');
      if (idx >= notes.length) {
        active = -1;
        setTimeout(() => { if (running) showReward({ msg: 'Toll gemacht!', again: reset, andere: () => openPicker('wait') }); }, 700);
      } else {
        setTimeout(() => { if (!running) return; busy = false; pick(); }, 500);
      }
    } else {
      hintTone();
      const c = cells[active];
      c.classList.remove('hint'); void c.offsetWidth; c.classList.add('hint');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => c.classList.remove('hint'), 2900);
    }
  }
  return {
    start() { running = true; reset(); },
    stop() { running = false; clearTimeout(hintTimer); setActive(-1); }
  };
})();

/* ================================================================
   MODUS 4: MUSTER MERKEN
   2-6 Toene aus dem zuletzt gewaehlten Lied werden vorgespielt.
   Laenge passt sich langsam an: +1 nach 3 Erfolgen, -1 nach 2 Fehlern.
   ================================================================ */
const Simon = (() => {
  const fields = $$('.sfield');
  const status = $('#simonStatus'), lenEl = $('#simonLen');
  let TONES = ['C4', 'E4', 'G4', 'C5'];
  let seq = [], pos = 0, locked = true, len = 2, erfolge = 0, fehler = 0, timers = [], running = false;
  const lightTimers = [0, 0, 0, 0];
  const later = (fn, ms) => { timers.push(setTimeout(() => { if (running) fn(); }, ms)); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const setStatus = s => { status.textContent = s; };
  const updateLen = () => { lenEl.textContent = '[ ' + len + ' TÖNE ]'; };
  function toeneAusLied() {
    const set = [];
    liedToene(aktLied()).forEach(t => { const m = tonMidi(t); if (set.indexOf(m) < 0) set.push(m); });
    set.sort((a, b) => a - b);
    if (set.length < 4) return ['C4', 'E4', 'G4', 'C5'];
    const namen = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'H'];
    return [0, 1, 2, 3].map(i => { const m = set[Math.round(i * (set.length - 1) / 3)]; return namen[m % 12] + (Math.floor(m / 12) - 1); });
  }
  function neueFolge() {
    seq = [];
    for (let i = 0; i < len; i++) {
      let n; do { n = Math.floor(Math.random() * 4); } while (seq.length && n === seq[seq.length - 1] && Math.random() < 0.6);
      seq.push(n);
    }
  }
  function light(i, ms) {
    clearTimeout(lightTimers[i]);
    fields[i].classList.add('on');
    lightTimers[i] = setTimeout(() => fields[i].classList.remove('on'), ms);
  }
  function pulse(i) {
    const f = fields[i];
    f.classList.remove('hint'); void f.offsetWidth; f.classList.add('hint');
    setTimeout(() => f.classList.remove('hint'), 2900);
  }
  function playSeq() {
    clearTimers();
    locked = true; pos = 0;
    setStatus('Schau gut zu …');
    const step = 1100;
    seq.forEach((v, k) => later(() => { light(v, 700); playNote(TONES[v]); }, 900 + k * step));
    later(() => { locked = false; pos = 0; setStatus('Jetzt du!'); }, 900 + seq.length * step);
  }
  function tap(i) {
    if (!running || locked) return;
    if (i === seq[pos]) {
      light(i, 600); playNote(TONES[i]);
      pos++;
      if (pos >= seq.length) {
        locked = true; erfolge++; fehler = 0;
        setStatus('Super!');
        later(() => showReward({ msg: 'Richtig gemerkt!' }), 500);
        later(() => {
          if (erfolge >= 3 && len < 6) { len++; erfolge = 0; }
          neueFolge(); updateLen(); playSeq();
        }, 3700);
      }
    } else {
      locked = true; fehler++; erfolge = 0;
      hintTone();
      pulse(seq[pos]);
      setStatus('Fast! Schau noch einmal zu.');
      later(() => {
        if (fehler >= 2 && len > 2) { len--; fehler = 0; neueFolge(); updateLen(); }
        playSeq();
      }, 3000);
    }
  }
  fields.forEach((f, i) => f.addEventListener('pointerdown', e => { e.preventDefault(); tap(i); }));
  $('#simonReplay').addEventListener('click', () => { if (running && !locked) playSeq(); });
  return {
    start() { running = true; TONES = toeneAusLied(); len = 2; erfolge = 0; fehler = 0; neueFolge(); updateLen(); playSeq(); },
    stop() { running = false; clearTimers(); fields.forEach(f => f.classList.remove('on', 'hint')); }
  };
})();

/* ================================================================
   MODUS 5: BERUHIGENDE SPIELE
   Blasen, Farbflaechen oder Ringe malen. Kein Ziel, kein Druck.
   ================================================================ */
const Calm = (() => {
  const cv = $('#calmCanvas'), ctx = cv.getContext('2d'), pads = $('#pads');
  const PENTA = ['C4', 'D4', 'E4', 'G4', 'A4', 'C5', 'D5', 'E5', 'G5', 'A5', 'C6'];
  const PAD_NOTES = ['C4', 'D4', 'E4', 'G4', 'A4', 'C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6'];
  let W = 0, H = 0, raf = 0, last = 0, running = false, sub = settings.calmSub;
  let bubbles = [], pops = [], ringe = [], nextSpawn = 0;
  PAD_NOTES.forEach((n, i) => {
    const p = document.createElement('button');
    p.className = 'pad'; p.style.setProperty('--col', 'var(--spur' + (i % 4 + 1) + ')');
    p.setAttribute('aria-label', 'Farbe ' + (i + 1));
    p.addEventListener('pointerdown', e => { e.preventDefault(); playNote(n, 0.75, 2.2); ripple(p, e); });
    pads.appendChild(p);
  });
  function resize() { const s = fitCanvas(cv, ctx); W = s.W; H = s.H; }
  function makeBubble(y) {
    const r = 48 + Math.random() * 40;
    return { x: r + Math.random() * Math.max(1, W - 2 * r), y: y != null ? y : H + r, r,
      vy: 22 + Math.random() * 20, ph: Math.random() * 6.28, col: Math.floor(Math.random() * 4) };
  }
  function seed() {
    bubbles = []; pops = [];
    for (let i = 0; i < 6; i++) bubbles.push(makeBubble(H * (0.2 + Math.random() * 0.8)));
  }
  function frame(ts) {
    if (!running) return;
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts;
    const now = ts / 1000;
    if (sub === 'bubbles') {
      if (bubbles.length < 11 && now > nextSpawn) { bubbles.push(makeBubble()); nextSpawn = now + 1.2 + Math.random() * 1.4; }
      bubbles.forEach(b => { b.y -= b.vy * dt; b.x += Math.sin(now * 0.6 + b.ph) * 12 * dt; });
      bubbles = bubbles.filter(b => b.y > -b.r - 10);
    }
    if (sub !== 'pads') draw(now);
    raf = requestAnimationFrame(frame);
  }
  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    const cs = SPUR_FARBEN;
    if (sub === 'bubbles') {
      bubbles.forEach(b => {
        const fadeTop = Math.min(1, (b.y + b.r) / (H * 0.15));
        ctx.globalAlpha = 0.8 * Math.max(0, fadeTop);
        const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
        g.addColorStop(0, 'rgba(255,255,255,0.25)');
        g.addColorStop(0.5, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(255,255,255,0.06)');
        ctx.fillStyle = cs[b.col]; ctx.globalAlpha *= 0.25;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.8 * Math.max(0, fadeTop);
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = cs[b.col]; ctx.lineWidth = 2.5; ctx.stroke();
      });
      pops = pops.filter(p => now - p.t0 < 0.9);
      pops.forEach(p => {
        const a = (now - p.t0) / 0.9;
        ctx.globalAlpha = 0.5 * (1 - a);
        ctx.strokeStyle = cs[p.col]; ctx.lineWidth = 6 * (1 - a) + 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + 0.6 * a), 0, Math.PI * 2); ctx.stroke();
      });
    } else if (sub === 'ringe') {
      ringe = ringe.filter(r => now - r.t0 < 4.5);
      ringe.forEach(r => {
        const a = (now - r.t0) / 4.5, e = 1 - Math.pow(1 - a, 2);
        ctx.globalAlpha = 0.75 * (1 - a); ctx.strokeStyle = cs[r.col]; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(r.x, r.y, 14 + 190 * e, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 0.35 * (1 - a); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(r.x, r.y, 8 + 120 * e, 0, Math.PI * 2); ctx.stroke();
      });
      if (!ringe.length) {
        ctx.globalAlpha = 0.6; ctx.fillStyle = cssVar('--text-dim') || '#86a9ad';
        ctx.font = '600 26px ' + (cssVar('--fh') || 'sans-serif'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Tippe irgendwo hin', W / 2, H / 2);
      }
    }
    ctx.globalAlpha = 1;
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running) return;
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (sub === 'ringe') {
      if (ringe.length > 14) ringe.shift();
      const k = clamp(Math.round(x / Math.max(1, W) * (PENTA.length - 1)), 0, PENTA.length - 1);
      ringe.push({ x, y, t0: nowSec(), col: k % 4 });
      playNote(PENTA[k], 0.65, 2.6);
      return;
    }
    if (sub !== 'bubbles') return;
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot(b.x - x, b.y - y) <= b.r + 22) {
        bubbles.splice(i, 1);
        pops.push({ x: b.x, y: b.y, r: b.r, col: b.col, t0: nowSec() });
        const k = Math.round((1 - (b.r - 48) / 40) * (PENTA.length - 1));
        playNote(PENTA[clamp(k, 0, PENTA.length - 1)], 0.7, 2.2);
        return;
      }
    }
  });
  function setSub(s) {
    sub = s; settings.calmSub = s; saveSettings();
    $$('#calm .tab').forEach(t => t.classList.toggle('sel', t.dataset.sub === s));
    cv.classList.toggle('hidden', s === 'pads');
    pads.classList.toggle('show', s === 'pads');
    if (s !== 'pads') { resize(); if (s === 'bubbles' && !bubbles.length) seed(); }
  }
  $$('#calm .tab').forEach(t => t.addEventListener('click', () => setSub(t.dataset.sub)));
  return {
    start() { running = true; spurFarbenLesen(); setSub(sub); resize(); seed(); ringe = []; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running && sub !== 'pads') resize(); }
  };
})();

/* ================================================================
   MODUS 6: KUTHU-TROMMELN
   Drei weiche Trommeln. Die naechste Trommel im Rhythmus leuchtet sanft
   und wartet - kein Zeitdruck. 8 Grundrhythmen.
   ================================================================ */
const Drum = (() => {
  const DRUMS = [
    { k: 'D', label: 'Dumpf',  sym: '&#9679;',        col: 'var(--spur3)' },
    { k: 'T', label: 'Hell',   sym: '&#9675;',        col: 'var(--spur1)' },
    { k: 'K', label: 'Doppel', sym: '&#9679;&#9679;', col: 'var(--spur2)' }
  ];
  const RHYTHMS = [
    { name: 'Ruhiger Gang',  pat: 'DTDT' },
    { name: 'Marsch',        pat: 'DDTT' },
    { name: 'Grundschlag',   pat: 'DTKT' },
    { name: 'Doppel-Takt',   pat: 'DTTDKTDT' },
    { name: 'Festschritt',   pat: 'DKTDDKTT' },
    { name: 'Tanzschritt',   pat: 'DTKDTDKT' },
    { name: 'Kuthu-Schritt', pat: 'DKDTDKDT' },
    { name: 'Hüpfer',        pat: 'DTKTDTDK' }
  ];
  const grid = $('#dgrid'), stepsEl = $('#dsteps'), prog = $('#drumProg'), rhyList = $('#rhyList'), demoBtn = $('#drumDemo');
  let running = false, busy = false, demoing = false, pos = 0, count = 0, total = 16;
  let timers = [], hintTimer = 0, bgTimer = 0, bgNext = 0, bgStep = 0;
  const later = (fn, ms) => { timers.push(setTimeout(() => { if (running) fn(); }, ms)); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const beat = () => 60 / settings.bpm;
  const rhythm = () => RHYTHMS[Math.min(settings.rhythm, RHYTHMS.length - 1)];
  const pat = () => rhythm().pat;
  const cells = DRUMS.map((d, i) => {
    const b = document.createElement('button');
    b.className = 'cell'; b.style.setProperty('--col', d.col);
    b.innerHTML = '<span class="ds">' + d.sym + '</span><span class="dl">' + d.label + '</span>';
    b.setAttribute('aria-label', d.label);
    b.addEventListener('pointerdown', e => { e.preventDefault(); tap(i, e); });
    grid.appendChild(b);
    return b;
  });
  const idxOf = k => DRUMS.findIndex(d => d.k === k);
  const rhyBtns = RHYTHMS.map((r, i) => {
    const b = document.createElement('button');
    b.className = 'pille rhy';
    b.textContent = r.name;
    b.addEventListener('click', () => { settings.rhythm = i; saveSettings(); markRhythm(); if (running) reset(); });
    rhyList.insertBefore(b, demoBtn);
    return b;
  });
  function markRhythm() { rhyBtns.forEach((b, i) => b.classList.toggle('sel', i === Math.min(settings.rhythm, RHYTHMS.length - 1))); }
  function buildSteps() {
    stepsEl.innerHTML = '';
    pat().split('').forEach(k => {
      const s = document.createElement('span');
      s.className = 'dstep' + (k === 'D' ? ' big' : '');
      stepsEl.appendChild(s);
    });
  }
  function markSteps() {
    $$('.dstep', stepsEl).forEach((s, i) => {
      s.classList.toggle('done', i < pos);
      s.classList.toggle('now', i === pos && !demoing);
    });
  }
  function setGlow(n) {
    cells.forEach(c => c.classList.remove('glow', 'hint'));
    if (n >= 0) cells[n].classList.add('glow');
  }
  function updateProgress() { prog.style.width = (100 * count / total) + '%'; }
  function reset() {
    clearTimers(); demoing = false; busy = false;
    pos = 0; count = 0; total = 16;
    cells.forEach(c => c.classList.remove('on'));
    buildSteps(); markSteps(); updateProgress();
    setGlow(idxOf(pat()[0]));
  }
  function tap(i, e) {
    if (!running) return;
    if (demoing || busy) { playDrum(DRUMS[i].k, 0.7); ripple(cells[i], e); return; }  /* freies Mittrommeln */
    const want = idxOf(pat()[pos]);
    if (i === want) {
      playDrum(DRUMS[i].k, 1);
      ripple(cells[i], e);
      cells[i].classList.remove('glow', 'hint');
      count++; pos = (pos + 1) % pat().length;
      updateProgress(); markSteps();
      busy = true;
      if (count >= total) later(() => showReward({ msg: 'Toll getrommelt!', again: reset }), 700);
      else later(() => { busy = false; setGlow(idxOf(pat()[pos])); }, Math.round(beat() * 1000));
    } else {
      hintTone();
      const c = cells[want];
      c.classList.remove('hint'); void c.offsetWidth; c.classList.add('hint');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => c.classList.remove('hint'), 2900);
    }
  }
  function demo() {
    if (!running || demoing) return;
    clearTimers(); demoing = true; busy = false;
    setGlow(-1); markSteps();
    const p = pat(), ms = Math.round(beat() * 1000);
    p.split('').forEach((k, j) => {
      later(() => {
        const n = idxOf(k);
        playDrum(k, 0.9);
        cells.forEach(c => c.classList.remove('on'));
        cells[n].classList.add('on');
      }, 400 + j * ms);
    });
    later(() => {
      cells.forEach(c => c.classList.remove('on'));
      demoing = false; markSteps(); setGlow(idxOf(p[pos]));
    }, 400 + p.length * ms + 300);
  }
  demoBtn.addEventListener('click', demo);
  /* Leise Kuthu-Begleitung im Hintergrund (abschaltbar), Muster X..x X.x. X..x X.xx */
  const BG = TROMMEL['kuthu-1'];
  function bgTick() {
    if (!running || !settings.drumBg || !actx || !master) return;
    const now = actx.currentTime;
    if (bgNext < now) bgNext = now + 0.1;
    while (bgNext < now + 0.25) {
      const c = BG[bgStep % BG.length];
      if (c === 'X') playDrum('D', 0.22, bgNext); else if (c === 'x') playDrum('T', 0.1, bgNext);
      bgStep++; bgNext += beat() / 4;
    }
  }
  function bgStart() { bgStop(); if (!settings.drumBg) return; ensureAudio(); bgStep = 0; bgNext = 0; bgTimer = setInterval(bgTick, 60); }
  function bgStop() { clearInterval(bgTimer); bgTimer = 0; }
  $('#drumBgBtn').addEventListener('click', () => {
    settings.drumBg = !settings.drumBg; saveSettings(); syncUI();
    if (running) bgStart(); else bgStop();
  });
  markRhythm();
  return {
    start() { running = true; markRhythm(); reset(); bgStart(); },
    stop() { running = false; clearTimers(); clearTimeout(hintTimer); bgStop(); setGlow(-1); cells.forEach(c => c.classList.remove('on')); }
  };
})();

/* ---------------- Navigation: immer gleicher Ablauf ---------------- */
const MODES = { lied: Lied, tiles: Tiles, wait: Wait, simon: Simon, calm: Calm, drum: Drum };
let current = 'menu';
function show(name) {
  if (MODES[current]) MODES[current].stop();
  hideReward();
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === name));
  current = name;
  syncUI();
  if (name === 'lieder') pickerRender();
  if (name === 'einst') $('#einst .bar-hud').textContent = '[ FÜR ELTERN ]';
  if (MODES[name]) { requestWake(); MODES[name].start(); }
  else releaseWake();
}
$$('[data-go]').forEach(b => b.addEventListener('click', () => {
  const g = b.dataset.go;
  if (g === 'lied' || g === 'tiles' || g === 'wait') openPicker(g); else show(g);
}));
$$('.back').forEach(b => b.addEventListener('click', () => show('menu')));
window.addEventListener('resize', () => { Lied.resize(); Tiles.resize(); Calm.resize(); });

/* ---------------- Vollbild ----------------
   In der Android-Huelle gibt es die Bruecke window.AndroidHuelle
   (setVollbild(boolean), istVollbild()). Im Browser wird die
   Fullscreen-API genutzt. Fehler werden als Hinweis angezeigt. */
const fullBtn = $('#fullBtn'), fullTxt = $('#fullTxt');
let huelleVoll = null;
const hatHuelle = () => !!(window.AndroidHuelle && typeof window.AndroidHuelle.setVollbild === 'function');
function apiVoll() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function istVoll() {
  if (hatHuelle()) {
    try { if (typeof window.AndroidHuelle.istVollbild === 'function') return !!window.AndroidHuelle.istVollbild(); } catch (e) {}
    return huelleVoll == null ? true : huelleVoll;
  }
  return apiVoll();
}
function updateFullBtn() {
  const an = istVoll();
  fullTxt.textContent = an ? 'Leisten zeigen' : 'Vollbild';
  fullBtn.classList.toggle('on', an);
  fullBtn.setAttribute('aria-pressed', an ? 'true' : 'false');
}
function fullscreenMoeglich() {
  const el = document.documentElement;
  return hatHuelle() || !!(el.requestFullscreen || el.webkitRequestFullscreen);
}
function toggleVollbild() {
  if (hatHuelle()) {
    try {
      const neu = !istVoll();
      window.AndroidHuelle.setVollbild(neu);
      huelleVoll = neu;
    } catch (e) { toast('Vollbild hat nicht geklappt.'); console.warn('AndroidHuelle.setVollbild:', e); }
    updateFullBtn(); setTimeout(updateFullBtn, 400);
    return;
  }
  const d = document, el = d.documentElement;
  const fehler = err => { toast('Vollbild ist hier nicht möglich.'); console.warn('Vollbild:', err && err.message ? err.message : err); updateFullBtn(); };
  try {
    if (!apiVoll()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { fehler('keine Fullscreen-API'); return; }
      const p = req.call(el);
      if (p && p.then) p.then(updateFullBtn, fehler);
    } else {
      const ex = d.exitFullscreen || d.webkitExitFullscreen;
      if (!ex) { fehler('kein exitFullscreen'); return; }
      const p = ex.call(d);
      if (p && p.then) p.then(updateFullBtn, fehler);
    }
  } catch (e) { fehler(e); }
  setTimeout(updateFullBtn, 600);
}
fullBtn.addEventListener('click', toggleVollbild);
document.addEventListener('fullscreenchange', updateFullBtn);
document.addEventListener('webkitfullscreenchange', updateFullBtn);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updateFullBtn(); });
if (!fullscreenMoeglich()) fullBtn.style.display = 'none';   /* nichts moeglich: Knopf ausblenden statt stumm */

/* nur fuer automatische Tests: liest den Zustand des Lied-Spiels, aendert nichts */
window.KrishnaTest = { lied: () => Lied.zustand(), lieder: () => LIEDER.map(l => ({ id: l.id, stufe: l.stufe, sekunden: l.sekunden, probleme: liedPruefen(l) })) };

applyLook();
syncUI();
updateFullBtn();
</script>
