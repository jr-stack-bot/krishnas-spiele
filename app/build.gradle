// Krishnas Spiele - App-Modul @ Joschy
plugins {
    id "com.android.application"
}

android {
    namespace "de.joschy.krishnaspiele"
    compileSdk 34

    defaultConfig {
        applicationId "de.joschy.krishnaspiele"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // Fester Debug-Schluessel (Standardpasswoerter), damit neue APKs
        // als Update ueber die alte Version installiert werden koennen.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
